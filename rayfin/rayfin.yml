id: app2
name: APP2
version: 1.0.14
services:
  auth:
    enabled: true
    customClaims:
      app_version: 1.0.0
    scopes:
      - read:data
      - write:data
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
      - https://curly-coast-3e91b7a84a-westeurope.webapp.fabricapps.net
    fabric:
      enabled: true
  data:
    enabled: true
    dialect: mssql
  staticHosting:
    enabled: true
    folder: client/dist
    indexDocument: index.html
    buildCommand: npm run build
  storage:
    enabled: false
  functions:
    enabled: false
